name: Build A-Z Live APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # توليد مجلد أندرويد عند الحاجة
      - name: توليد مشروع أندرويد عند الحاجة
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name az_live --org com.azlive .
          fi

      # ضبط الصلاحيات واسم التطبيق
      - name: ضبط الصلاحيات واسم التطبيق
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application|' "$MANIFEST"
            fi
            sed -i 's/android:label="[^"]*"/android:label="A-Z Live"/' "$MANIFEST"
          fi

      # حقن سكربت تهيئة Gradle العالمي لإجبار compileSdk 36 و minSdk 24 على كافة الحزم والمشروع
      - name: إعداد توافق Gradle الشامل (SDK 36)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/override_sdk.gradle
          gradle.projectsLoaded {
              rootProject.allprojects {
                  afterEvaluate { p ->
                      if (p.hasProperty('android')) {
                          p.android {
                              compileSdkVersion 36
                              defaultConfig {
                                  minSdkVersion 24
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: تحميل الحزم
        run: flutter pub get

      # توليد الأيقونة عند توفر الصور
      - name: توليد أيقونة التطبيق
        run: |
          if [ -f assets/images/app_icon.png ] && [ -f assets/images/app_icon_foreground.png ]; then
            dart run flutter_launcher_icons
          else
            echo "ملفات الأيقونة غير موجودة، سيتم استخدام الأيقونة الافتراضية"
          fi

      # بناء الـ APK
      - name: بناء APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: az-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
